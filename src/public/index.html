<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Employee WiFi</title>
<!-- base.css provides GL's --gl-* palette; below we recreate GL's semantic theme
     variables (default + dark) exactly as the admin UI maps them, so this standalone
     page matches GL.iNet's look and adapts to light/dark. -->
<link rel="stylesheet" href="/theme/base.css" />
<style>
  :root {
    --background-main: var(--gl-gray-100, #ebebf0);
    --background-card: var(--gl-white, #fff);
    --background-content: var(--gl-gray-100, #ebebf0);
    --divider: var(--gl-gray-100, #ebebf0);
    --border: var(--gl-gray-200, #d2d2d6);
    --text-regular: var(--gl-purple-800, #141427);
    --text-title: var(--gl-purple-700, #1f1f3d);
    --text-weak: var(--gl-purple-500, #333366);
    --text-hint: var(--gl-gray-400, #a0a0a3);
    --primary: var(--gl-blue-500, #5272f7);
    --primary-hover: var(--gl-blue-700, #425bc6);
    --primary-background: var(--gl-blue-50, #eef1fe);
    --error: var(--gl-red-500, #e04c7e);
    --error-background: var(--gl-red-50, #fcedf2);
    --success: var(--gl-green-600, #00ad9d);
    --success-background: var(--gl-green-50, #e7f9f8);
    /* Wi-Fi signal arcs: lit = visible, unlit = faint. These flip for dark mode below,
       so a strong (all-lit) network never renders as near-invisible dark arcs on a dark card. */
    --sig-on: var(--gl-gray-700, #555557);
    --sig-off: var(--gl-gray-200, #d2d2d6);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background-main: var(--gl-black, #000);
      --background-card: var(--gl-purple-800, #141427);
      --background-content: var(--gl-gray-900, #222223);
      --divider: var(--gl-gray-800, #3c3c3d);
      --border: var(--gl-gray-500, #87878a);
      --text-regular: var(--gl-gray-300, #b9b9bd);
      --text-title: var(--gl-gray-200, #d2d2d6);
      --text-weak: var(--gl-purple-400, #9195aa);
      --text-hint: var(--gl-gray-700, #555557);
      --primary: var(--gl-blue-600, #4665de);
      --primary-hover: var(--gl-blue-700, #425bc6);
      --primary-background: var(--gl-blue-900, #212e63);
      --error: var(--gl-red-600, #c94471);
      --error-background: var(--gl-red-900, #5a1e32);
      --success: var(--gl-green-500, #00c8b5);
      --success-background: var(--gl-green-900, #00645b);
      /* dark mode: lit arcs are the light gray, unlit the dark gray (swapped from light) */
      --sig-on: var(--gl-gray-200, #d2d2d6);
      --sig-off: var(--gl-gray-700, #555557);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--background-main); color: var(--text-regular);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
  .brand { display: flex; align-items: center; gap: 10px; margin: 4px 0 20px; }
  .brand .dot { width: 30px; height: 30px; border-radius: 8px; background: var(--primary);
    display: flex; align-items: center; justify-content: center; }
  .brand h1 { font-size: 18px; font-weight: 600; margin: 0; color: var(--text-title); }
  .brand #health { margin-left: auto; }
  .health { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 4px 10px; font-size: 11px; color: var(--text-weak); }
  .health > span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .health svg { display: block; }
  .health .batt.chg { color: var(--success); }
  .card { background: var(--background-card); border-radius: 10px; padding: 20px 22px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; color: var(--text-title); }
  .muted { color: var(--text-weak); font-size: 13px; line-height: 1.5; margin: 0; }
  label { display: block; font-size: 13px; color: var(--text-weak); margin: 16px 0 6px; }
  input[type=password], input[type=text] {
    width: 100%; height: 40px; padding: 0 12px; font-size: 14px; border: 1px solid var(--border);
    border-radius: 4px; outline: none; background: var(--background-card); color: var(--text-regular);
  }
  input::placeholder { color: var(--text-hint); }
  input:focus { border-color: var(--primary); }
  button.primary {
    width: 100%; margin-top: 18px; height: 40px; font-size: 14px; font-weight: 600;
    color: #fff; background: var(--primary); border: none; border-radius: 4px; cursor: pointer;
  }
  button.primary:hover { background: var(--primary-hover); }
  button.primary:disabled { opacity: .55; cursor: default; }
  button.ghost {
    height: 32px; padding: 0 14px; font-size: 13px; color: var(--primary);
    background: transparent; border: 1px solid var(--border); border-radius: 4px; cursor: pointer;
  }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  ul.aps { list-style: none; margin: 6px 0 0; padding: 0; }
  li.ap { display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 12px 6px;
    border-bottom: 1px solid var(--divider); cursor: pointer; }
  li.ap:hover { background: var(--background-content); }
  li.ap .name { flex: 1; font-size: 14px; color: var(--text-regular);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icons { display: flex; align-items: center; gap: 6px; color: var(--text-weak); }
  li.ap .sig { font-size: 12px; color: var(--text-weak); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .banner { padding: 11px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
  .banner.ok { background: var(--success-background); color: var(--success); }
  .banner.err { background: var(--error-background); color: var(--error); }
  .banner.info { background: var(--primary-background); color: var(--primary); }
  .hide { display: none !important; }
  .center { text-align: center; }
  .spin { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--divider);
    border-top-color: var(--primary); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -3px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center;
    justify-content: center; padding: 20px; }
  .modal { background: var(--background-card); border-radius: 10px; padding: 22px; width: 100%; max-width: 400px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <span class="dot">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
        <path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1.1" fill="#fff" stroke="none"/>
      </svg>
    </span>
    <h1 data-i18n="title">Employee WiFi</h1>
    <div id="health" class="health hide"></div>
  </div>

  <!-- Admin-authored message banner (persistent; separate from the transient #banner
       status line). Rendered via textContent only, so admin text can never inject HTML. -->
  <div id="adminBanner" class="banner info hide"></div>

  <div id="banner" class="banner hide"></div>

  <!-- Login -->
  <div id="login" class="card hide">
    <h2 data-i18n="login_title">Enter password</h2>
    <p class="muted" data-i18n="login_hint">Ask your administrator for the employee WiFi password.</p>
    <label for="pw" data-i18n="password">Password</label>
    <input id="pw" type="password" autocomplete="off" />
    <button class="primary" id="loginBtn" data-i18n="continue">Continue</button>
  </div>

  <!-- Networks -->
  <div id="main" class="card hide">
    <div class="row-between">
      <div><h2 style="margin:0" data-i18n="networks_title">Available networks</h2><p class="muted" id="statusLine" data-i18n="choose">Choose a network to connect.</p></div>
      <button class="ghost" id="scanBtn" data-i18n="rescan">Rescan</button>
    </div>
    <div id="scanState" class="muted center hide" style="padding:20px 0"><span class="spin"></span> <span data-i18n="scanning">Scanning&hellip;</span></div>
    <ul class="aps" id="aps"></ul>
  </div>
</div>

<!-- Password modal for a chosen network -->
<div id="modal" class="modal-bg hide">
  <div class="modal">
    <h2 id="mTitle" style="margin:0 0 4px" data-i18n="connect">Connect</h2>
    <p class="muted" id="mName"></p>
    <div id="mKeyWrap">
      <label for="mKey" data-i18n="wifi_password">WiFi password</label>
      <input id="mKey" type="password" autocomplete="off" />
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="ghost" style="flex:1" id="mCancel" data-i18n="cancel">Cancel</button>
      <button class="primary" style="flex:1;margin-top:0" id="mJoin" data-i18n="join">Join</button>
    </div>
  </div>
</div>

      var l = String(list[i] || "").toLowerCase();
      if (l.indexOf("zh") === 0) return /tw|hk|mo|hant/.test(l) ? "zh-tw" : "zh-cn";
      var base = l.split("-")[0];
      if (I18N[base]) return base;
    }
    return "en";
  })();
  var DICT = I18N[LANG] || I18N.en;
  function t(key) {
    var v = DICT[key];
    return v != null ? v : (I18N.en[key] != null ? I18N.en[key] : key);
  }
  function fmt(s) {
    var a = arguments, i = 1;
    return String(s).replace(/%s/g, function () { return i < a.length ? a[i++] : "%s"; });
  }
  function applyStatic() {
    document.documentElement.lang = LANG;
    document.title = t("title");
    var nodes = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < nodes.length; i++)
      nodes[i].textContent = t(nodes[i].getAttribute("data-i18n"));
  }

  function $(id) { return document.getElementById(id); }
  function show(id, on) { $(id).classList.toggle("hide", !on); }

  function banner(kind, msg) {
    var b = $("banner");
    if (!msg) { b.classList.add("hide"); return; }
    b.className = "banner " + kind;
    b.textContent = msg;
  }

  function rpc(method, args) {
    args = args || {};
    return fetch("/rpc", {
      method: "POST",
      // X-Empwifi is a CSRF guard: the backend rejects emp_* calls without it, and a
      // cross-origin "simple" request cannot set a custom header without preflight.
      headers: { "Content-Type": "application/json", "X-Empwifi": "1" },
      body: JSON.stringify({ jsonrpc: "2.0", id: Date.now(), method: "call",
        params: ["", "empwifi", method, args] })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.error) {
        var e = new Error((j.error && (j.error.err || j.error.message)) || "error");
        e.code = j.error && j.error.err;
        throw e;
      }
      return (j && j.result) || {};
    });
  }

  // bars 0..4 from either RSSI dBm (<=0) or percentage (0..100)
  function bars(sig) {
    if (sig == null) return 2;
    var pct = sig <= 0 ? Math.max(0, Math.min(100, 2 * (sig + 100))) : Math.max(0, Math.min(100, sig));
    return Math.round(pct / 25);
  }
  // Exact signal as a label next to each network: RSSI in dBm when the driver reports it
  // (<= 0, the GL repeater's native unit), otherwise a percentage. Lets staff compare
  // strength precisely instead of eyeballing the 0-4 bar glyph.
  function signalText(sig) {
    if (sig == null) return "";
    return sig <= 0 ? sig + " dBm" : sig + "%";
  }
  function wifiSvg(n) {
    var on = "var(--sig-on)", off = "var(--sig-off)";
    function arc(d, lit) { return '<path d="' + d + '" fill="none" stroke="' + (lit ? on : off) + '" stroke-width="2" stroke-linecap="round"/>'; }
    return '<svg width="22" height="22" viewBox="0 0 24 24">' +
      arc("M3 9.5a14 14 0 0 1 18 0", n >= 4) +
      arc("M6 13a9.5 9.5 0 0 1 12 0", n >= 3) +
      arc("M8.7 16.2a5.5 5.5 0 0 1 6.6 0", n >= 2) +
      '<circle cx="12" cy="19.3" r="1.2" fill="' + (n >= 1 ? on : off) + '"/></svg>';
  }
  function lockSvg() {
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm3 8H9V6a3 3 0 0 1 6 0v3z"/></svg>';
  }
  function secured(ap) { return !!(ap && ap.secured); }

  function thermoSvg() {
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V5a2 2 0 0 0-4 0v9.76a4 4 0 1 0 4 0z"/></svg>';
  }
  function batterySvg(pct, charging) {
    var w = Math.max(0, Math.min(16, Math.round(pct / 100 * 16)));
    var col = pct <= 15 ? "var(--error,#e04c7e)" : (charging ? "var(--success,#00ad9d)" : "currentColor");
    return '<svg width="27" height="14" viewBox="0 0 27 14" fill="none">' +
      '<rect x="1" y="2.5" width="20" height="9" rx="2" stroke="currentColor" stroke-width="1.4"/>' +
      '<rect x="22.4" y="5" width="2.4" height="4" rx="1" fill="currentColor"/>' +
      '<rect x="2.6" y="4.1" width="' + w + '" height="6.3" rx="1" fill="' + col + '"/>' +
      (charging ? '<path d="M12.5 3.2l-3 5h2.3l-1 2.9 3.2-5h-2.3z" fill="#fff"/>' : "") +
      "</svg>";
  }

  function cpuSvg() {
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/></svg>';
  }
  // Device status widget in the header. Temperature mirrors the GL admin UI: MCU/device
  // sensor when present, else CPU/SoC thermal zone (both Celsius). Load is the 1-minute
  // average shown as a percentage of core count. Battery chip doubles as the charging
  // indicator (bolt + green when charging, title spells out the state).
  function renderHealth(hd) {
    var el = $("health");
    if (!hd || (hd.cpu_temp == null && hd.mcu_temp == null && hd.load == null && !hd.has_battery)) { el.classList.add("hide"); el.innerHTML = ""; return; }
    var parts = [];
    var devTemp = (hd.mcu_temp != null) ? hd.mcu_temp : hd.cpu_temp;
    if (devTemp != null) {
      // Shown value mirrors GL (MCU/device sensor). When both sensors exist, reveal the
      // CPU/SoC die temp on hover (title attribute; desktop only, no touch tooltip).
      var tip = (hd.mcu_temp != null && hd.cpu_temp != null)
        ? fmt(t("tip_device_cpu"), Math.round(hd.mcu_temp), Math.round(hd.cpu_temp))
        : (hd.mcu_temp != null ? t("tip_device") : t("tip_cpu"));
      parts.push('<span title="' + tip + '">' + thermoSvg() + Math.round(devTemp) + "&deg;</span>");
    }
    if (hd.load != null) {
      var cores = hd.cores || 1;
      var loadTip = fmt(cores > 1 ? t("tip_load") : t("tip_load1"), hd.load.toFixed(2), cores);
      parts.push('<span title="' + loadTip + '">' + cpuSvg() + Math.round(hd.load / cores * 100) + "%</span>");
    }
    if (hd.has_battery && hd.battery != null) {
      var chg = !!hd.charging;
      parts.push('<span class="batt' + (chg ? " chg" : "") + '" title="' + (chg ? t("tip_charging") : t("tip_on_battery")) + '">' + batterySvg(hd.battery, chg) + Math.round(hd.battery) + "%</span>");
    }
    el.innerHTML = parts.join("");
    el.classList.toggle("hide", parts.length === 0);
  }

  // Admin-authored banner: textContent only (never innerHTML) so it cannot inject markup.
  function renderAdminBanner(text) {
    var el = $("adminBanner");
    if (!text) { el.classList.add("hide"); el.textContent = ""; return; }
    el.textContent = text;
    el.classList.remove("hide");
  }

  function health() {
    rpc("emp_health", { token: token }).then(function (hd) {
      renderHealth(hd);
      renderAdminBanner(hd.banner);
    }).catch(function () {});
  }

  function gotoLogin(msg) {
    show("login", true); show("main", false);
    if (msg) banner("info", msg);
    setTimeout(function () { $("pw").focus(); }, 50);
  }
  function gotoMain() {
    show("login", false); show("main", true);
    banner("");
    refreshStatus();
    scan();
    health();   // refresh banner scope (now authenticated) + status widget
  }

  function tryEnter(password) {
    var args = password == null ? {} : { password: password };
    return rpc("emp_login", args).then(function (res) {
      token = res.token || "";
      if (!token) throw new Error("no token");
      sessionStorage.setItem("empwifi_token", token);
      gotoMain();
    });
  }

  function refreshStatus() {
    rpc("emp_status", { token: token }).then(function (s) {
      if (s && (s.connected || s.ssid)) {
        $("statusLine").textContent = s.ssid ? fmt(t("status_connected_to"), s.ssid) : t("status_connected");
      } else {
        $("statusLine").textContent = t("choose");
      }
    }).catch(function () {});
  }

  function scan() {
    show("scanState", true);
    $("aps").innerHTML = "";
    rpc("emp_scan", { token: token }).then(function (res) {
      show("scanState", false);
      render(res.list || []);
    }).catch(function (e) {
      show("scanState", false);
      if (e.code === "unauthorized") return needLogin();
      banner("err", t("scan_failed"));
    });
  }

  function render(list) {
    list.sort(function (a, b) { return (b.signal || -999) - (a.signal || -999); });
    var seen = {}, ul = $("aps");
    ul.innerHTML = "";
    list.forEach(function (ap) {
      if (!ap.ssid || seen[ap.ssid]) return;
      seen[ap.ssid] = 1;
      var li = document.createElement("li");
      li.className = "ap";
      li.innerHTML =
        '<span class="icons">' + wifiSvg(bars(ap.signal)) + '</span>' +
        '<span class="name"></span>' +
        '<span class="sig"></span>' +
        '<span class="icons">' + (secured(ap) ? lockSvg() : "") + "</span>";
      li.querySelector(".name").textContent = ap.ssid;
      li.querySelector(".sig").textContent = signalText(ap.signal);
      li.onclick = function () { choose(ap); };
      ul.appendChild(li);
    });
    if (!ul.children.length) {
      var empty = document.createElement("li");
      empty.className = "muted center";
      empty.style.cssText = "padding:18px 0;list-style:none";
      empty.textContent = t("no_networks");
      ul.appendChild(empty);
    }
  }

  function choose(ap) {
    pending = ap;
    $("mName").textContent = ap.ssid;
    $("mKey").value = "";
    show("mKeyWrap", secured(ap));
    show("modal", true);
    if (secured(ap)) setTimeout(function () { $("mKey").focus(); }, 50);
  }

  function join() {
    if (!pending) return;
    var args = { token: token, ssid: pending.ssid };
    if (secured(pending)) args.key = $("mKey").value;
    $("mJoin").disabled = true;
    rpc("emp_join", args).then(function () {
      show("modal", false);
      $("mJoin").disabled = false;
      banner("ok", fmt(t("connecting_to"), pending.ssid));
      pollStatus(pending.ssid, 0);
    }).catch(function (e) {
      $("mJoin").disabled = false;
      if (e.code === "unauthorized") { show("modal", false); return needLogin(); }
      banner("err", fmt(t("join_failed"), pending.ssid));
      show("modal", false);
    });
  }

  function pollStatus(ssid, n) {
    if (n > 15) { refreshStatus(); return; }
    rpc("emp_status", { token: token }).then(function (s) {
      if (s && s.connected) {
        banner("ok", fmt(t("banner_connected"), s.ssid || ssid));
        refreshStatus();
      } else {
        setTimeout(function () { pollStatus(ssid, n + 1); }, 2000);
      }
    }).catch(function () { setTimeout(function () { pollStatus(ssid, n + 1); }, 2000); });
  }

  function needLogin() {
    token = ""; sessionStorage.removeItem("empwifi_token");
    gotoLogin(t("session_expired"));
    health();   // token cleared -> refresh banner scope (now unauthenticated)
  }

  // wire up
  $("loginBtn").onclick = function () {
    banner("");
    $("loginBtn").disabled = true;
    tryEnter($("pw").value).catch(function (e) {
      $("loginBtn").disabled = false;
      if (e.code === "not_configured") banner("err", t("not_configured_login"));
      else if (e.code === "locked_out") banner("err", t("locked_out_login"));
      else banner("err", t("wrong_password"));
    });
  };
  $("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") $("loginBtn").click(); });
  $("scanBtn").onclick = scan;
  $("mCancel").onclick = function () { show("modal", false); };
  $("mJoin").onclick = join;
  $("mKey").addEventListener("keydown", function (e) { if (e.key === "Enter") join(); });

  // boot: if we have a token try it; otherwise probe whether a password is required
  function boot() {
    if (token) {
      rpc("emp_status", { token: token }).then(function () { gotoMain(); })
        .catch(function () { probe(); });
    } else { probe(); }
  }
  function probe() {
    // emp_login with no password: succeeds when no-password mode is on, else tells us to prompt
    tryEnter(null).catch(function (e) {
      if (e.code === "not_configured") { show("login", false); show("main", false);
        banner("info", t("not_configured_probe")); }
      else if (e.code === "locked_out") gotoLogin(t("locked_out_probe"));
      else gotoLogin();
    });
  }
  applyStatic();
  health();
  setInterval(health, 25000);   // device temp/battery + banner refresh (system.get_status is the dashboard poll)
  boot();
})();
</script>
</body>
</html>
